{
"name": "Lembrete diario",
"on": { "schedule": [ { "cron": "0 18 * * *" }, { "cron": "0 19 * * *" } ], "workflow_dispatch": {} },
"jobs": {
"tocar": {
"runs-on": "ubuntu-latest",
"steps": [
{ "uses": "actions/checkout@v4" },
{ "uses": "actions/setup-node@v4", "with": { "node-version": "20" } },
{ "run": "npm install web-push@3" },
{ "run": "node .github/workflows/enviar.js",
"env": { "VAPID_PUBLICA": "${{ secrets.VAPID_PUBLICA }}", "VAPID_PRIVADA": "${{ secrets.VAPID_PRIVADA }}", "SUBSCRICAO": "${{ secrets.SUBSCRICAO }}", "EVENTO": "${{ github.event_name }}" } }
]
}
}
}
